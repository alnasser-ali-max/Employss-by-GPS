<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الحضور — موظف</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060b14;--surface:#0d1520;--surface2:#132033;--surface3:#19293f;
  --border:#1c2e44;--accent:#00e5b0;--accent2:#38bdf8;
  --danger:#f87171;--warning:#fbbf24;--success:#34d399;
  --text:#dde8f0;--muted:#4d6680;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;}

/* animated bg */
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.12;pointer-events:none;animation:orbFloat 8s ease-in-out infinite;}
.bg-orb:nth-child(1){width:400px;height:400px;background:var(--accent);top:-100px;right:-100px;animation-delay:0s;}
.bg-orb:nth-child(2){width:300px;height:300px;background:var(--accent2);bottom:-80px;left:-80px;animation-delay:-3s;}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.05);}}

/* grid */
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,176,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,176,.025) 1px,transparent 1px);background-size:36px 36px;pointer-events:none;}

/* login screen */
#loginScreen{width:100%;max-width:380px;animation:fadeUp .5s ease;}
#appScreen{width:100%;max-width:420px;display:none;animation:fadeUp .4s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.6);}

/* login card */
.login-top{padding:36px 32px 24px;text-align:center;background:linear-gradient(160deg,#0a1628,#0d1e35);}
.login-logo{font-size:44px;margin-bottom:10px;display:block;}
.login-top h1{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;}
.login-top p{font-size:13px;color:var(--muted);}
.login-body{padding:28px 32px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.field input,.field select{width:100%;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border .2s,box-shadow .2s;direction:rtl;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,176,.1);}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),#00c49a);border:none;border-radius:11px;color:#000;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;margin-top:4px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,229,176,.3);}
.btn-primary:active{transform:translateY(0);}
.login-note{margin-top:14px;padding:10px 14px;background:var(--surface2);border-radius:8px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7;}

/* app header */
.app-header{padding:22px 24px 18px;background:linear-gradient(160deg,#0a1628,#0d1e35);border-bottom:1px solid var(--border);}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.user-info{display:flex;align-items:center;gap:10px;}
.user-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#000;}
.user-name{font-size:15px;font-weight:600;}
.user-dept{font-size:11px;color:var(--muted);}
.btn-logout-sm{padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;transition:all .2s;}
.btn-logout-sm:hover{border-color:var(--danger);color:var(--danger);}
.clock-row{text-align:center;}
.live-clock{font-size:38px;font-weight:700;letter-spacing:.04em;color:var(--text);line-height:1;}
.date-str{font-size:12px;color:var(--muted);margin-top:4px;}
.shift-chip{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:20px;background:rgba(0,229,176,.1);color:var(--accent);font-size:11px;font-weight:600;border:1px solid rgba(0,229,176,.18);}

/* app body */
.app-body{padding:22px 24px;}

/* status ring */
.ring-wrap{position:relative;width:148px;height:148px;margin:0 auto 20px;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:7;}
.ring-fill{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:357;stroke-dashoffset:357;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1),stroke .4s;}
.ring-inner{position:absolute;inset:15px;border-radius:50%;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px solid var(--border);}
.ring-icon{font-size:30px;}
.ring-txt{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-align:center;padding:0 4px;}

/* location box */
.loc-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
.loc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.loc-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;}
.loc-status{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;}
.pulse-dot{width:7px;height:7px;border-radius:50%;}
.pulse-dot.g{background:var(--success);animation:pd 1.8s infinite;}
.pulse-dot.y{background:var(--warning);animation:pd 1.2s infinite;}
.pulse-dot.r{background:var(--danger);}
@keyframes pd{0%,100%{opacity:1;}50%{opacity:.3;}}
.loc-coords{font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px;}
.dist-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px;}
.dist-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.dist-fill{height:100%;border-radius:2px;transition:width .6s,background .3s;}

/* work timer */
.timer-card{background:rgba(0,229,176,.06);border:1px solid rgba(0,229,176,.15);border-radius:12px;padding:12px 16px;margin-bottom:12px;text-align:center;display:none;}
.timer-card.show{display:block;}
.timer-label{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.08em;margin-bottom:4px;}
.timer-val{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:.06em;}

/* warning box */
.warn-box{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--warning);text-align:center;margin-bottom:10px;display:none;}
.warn-box.show{display:block;}

/* buttons */
.btn-checkin,.btn-checkout{width:100%;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;margin-bottom:8px;position:relative;overflow:hidden;}
.btn-checkin{background:linear-gradient(135deg,var(--accent),#00b894);color:#000;box-shadow:0 8px 24px rgba(0,229,176,.2);}
.btn-checkin:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,229,176,.35);}
.btn-checkin:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.btn-checkout{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;box-shadow:0 8px 20px rgba(248,113,113,.15);}
.btn-checkout:hover:not(:disabled){transform:translateY(-2px);}
.btn-checkout:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.btn-refresh{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-refresh:hover{border-color:var(--accent2);color:var(--accent2);}

/* today log */
.log-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.log-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.07em;margin-bottom:10px;}
.log-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;background:var(--surface2);margin-bottom:5px;font-size:12px;}
.log-badge{padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;}
.log-in{background:rgba(52,211,153,.13);color:var(--success);}
.log-out{background:rgba(248,113,113,.13);color:var(--danger);}

/* connecting overlay */
.connecting{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.conn-txt{font-size:14px;color:var(--muted);}

/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 20px;font-size:13px;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;transition:all .3s;z-index:200;display:flex;align-items:center;gap:8px;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* firebase status */
.fb-status{position:fixed;top:12px;left:12px;display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
</style>
</head>
<body>

<div class="bg-orb"></div>
<div class="bg-orb"></div>

<!-- connecting -->
<div class="connecting" id="connectingScreen">
  <div class="spin"></div>
  <div class="conn-txt">جارٍ الاتصال بالخادم...</div>
</div>

<!-- Firebase status -->
<div class="fb-status" id="fbStatus">
  <div class="pulse-dot y" id="fbDot"></div>
  <span id="fbTxt">يتصل...</span>
</div>

<!-- LOGIN -->
<div id="loginScreen" style="display:none">
  <div class="card">
    <div class="login-top">
      <span class="login-logo">📍</span>
      <h1>تسجيل الحضور</h1>
      <p>أدخل بياناتك للمتابعة</p>
    </div>
    <div class="login-body">
      <div class="field">
        <label>رقم الموظف</label>
        <input id="loginId" placeholder="مثال: EMP001" />
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input id="loginPass" type="password" placeholder="••••••" />
      </div>
      <button class="btn-primary" onclick="doLogin()">دخول ←</button>
      <div class="login-note">يجب أن يكون حسابك مضافاً من قِبَل المدير مسبقاً</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appScreen">
  <div class="card">
    <div class="app-header">
      <div class="header-top">
        <div class="user-info">
          <div class="user-av" id="userAv">؟</div>
          <div>
            <div class="user-name" id="userName">—</div>
            <div class="user-dept" id="userDept">—</div>
          </div>
        </div>
        <button class="btn-logout-sm" onclick="doLogout()">خروج</button>
      </div>
      <div class="clock-row">
        <div class="live-clock" id="liveClock">00:00:00</div>
        <div class="date-str" id="dateStr">—</div>
        <span class="shift-chip" id="shiftChip">—</span>
      </div>
    </div>

    <div class="app-body">
      <!-- ring -->
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="57"/>
          <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="57"/>
        </svg>
        <div class="ring-inner">
          <div class="ring-icon" id="ringIcon">📡</div>
          <div class="ring-txt" id="ringTxt">انتظار GPS</div>
        </div>
      </div>

      <!-- location -->
      <div class="loc-card">
        <div class="loc-top">
          <span class="loc-label">الموقع الحالي</span>
          <div class="loc-status">
            <div class="pulse-dot y" id="locDot"></div>
            <span id="locTxt">يحدد الموقع...</span>
          </div>
        </div>
        <div class="loc-coords" id="coordsTxt">—</div>
        <div class="dist-label">
          <span>المسافة عن العمل</span>
          <span id="distTxt">—</span>
        </div>
        <div class="dist-bar"><div class="dist-fill" id="distFill" style="width:0%;background:var(--warning)"></div></div>
      </div>

      <!-- work timer -->
      <div class="timer-card" id="timerCard">
        <div class="timer-label">⏱ مدة الحضور</div>
        <div class="timer-val" id="timerVal">00:00:00</div>
      </div>

      <!-- warning -->
      <div class="warn-box" id="warnBox">⚠️ سجّلت حضورك مسبقاً اليوم</div>

      <button class="btn-checkin" id="btnIn" onclick="doCheckin()" disabled>✅ تسجيل الحضور</button>
      <button class="btn-checkout" id="btnOut" onclick="doCheckout()" disabled>🚪 تسجيل الانصراف</button>
      <button class="btn-refresh" onclick="locateMe()">🔄 تحديث الموقع</button>

      <div class="log-section">
        <div class="log-title">سجل اليوم</div>
        <div id="logList"><div style="color:var(--muted);font-size:12px;text-align:center;padding:8px">لا توجد سجلات</div></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"><span id="tIcon">✅</span><span id="tMsg"></span></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, query, where, orderBy, onSnapshot, serverTimestamp, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ═══════════════════════════════════════════
// 🔥 FIREBASE CONFIG — ضع إعدادات مشروعك هنا
// ═══════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCA9li2HkqygTAp0rRqnCwLh2wZvTsQukI",
  authDomain: "employees-d6766.firebaseapp.com",
  projectId: "employees-d6766",
  storageBucket: "employees-d6766.firebasestorage.app",
  messagingSenderId: "353992589560",
  appId: "1:353992589560:web:3ff21c94b58725b1e9fb0d",
  measurementId: "G-15MFMTKHDN"
};
// ═══════════════════════════════════════════

// Demo mode: use localStorage when Firebase not configured
const DEMO_MODE = FIREBASE_CONFIG.apiKey === "DEMO_KEY";

let db = null;
let currentEmp = null;
let userLat = null, userLng = null;
let workLat = null, workLng = null;
let allowedRadius = 100;
let checkedIn = false, checkInTime = null;
let timerInt = null, clockInt = null;

// ─── COLORS ───
const COLORS = ['#00e5b0','#38bdf8','#a78bfa','#fb923c','#f472b6'];
const colorFor = n => COLORS[n.charCodeAt(0) % COLORS.length];

// ─── DEMO STORAGE ───
const local = {
  get: k => JSON.parse(localStorage.getItem('gpsDemo_' + k) || 'null'),
  set: (k, v) => localStorage.setItem('gpsDemo_' + k, JSON.stringify(v)),
  getEmployees: () => JSON.parse(localStorage.getItem('gpsDemo_employees') || '[]'),
  getRecords: () => JSON.parse(localStorage.getItem('gpsDemo_records') || '[]'),
  getSettings: () => JSON.parse(localStorage.getItem('gpsDemo_settings') || '{}'),
};

// ─── INIT ───
async function init() {
  if (!DEMO_MODE) {
    try {
      const app = initializeApp(FIREBASE_CONFIG);
      db = getFirestore(app);
      setFbStatus(true);
    } catch(e) { setFbStatus(false); }
  } else {
    setFbStatus(false, true);
  }
  document.getElementById('connectingScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  startClock();
  loadWorkSettings();
}

function setFbStatus(connected, demo=false) {
  const dot = document.getElementById('fbDot');
  const txt = document.getElementById('fbTxt');
  if (demo) { dot.className='pulse-dot y'; txt.textContent='وضع تجريبي'; }
  else if (connected) { dot.className='pulse-dot g'; txt.textContent='متصل'; }
  else { dot.className='pulse-dot r'; txt.textContent='غير متصل'; }
}

// ─── SETTINGS ───
async function loadWorkSettings() {
  if (DEMO_MODE) {
    const s = local.getSettings();
    workLat = s.workLat || null;
    workLng = s.workLng || null;
    allowedRadius = s.radius || 100;
  } else {
    try {
      const snap = await getDoc(doc(db, 'settings', 'workLocation'));
      if (snap.exists()) {
        const d = snap.data();
        workLat = d.lat; workLng = d.lng; allowedRadius = d.radius || 100;
      }
    } catch(e) {}
  }
}

// ─── LOGIN ───
window.doLogin = async function() {
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!id || !pass) { toast('⚠️','أدخل رقم الموظف وكلمة المرور'); return; }

  let emp = null;
  if (DEMO_MODE) {
    const emps = local.getEmployees();
    emp = emps.find(e => e.id === id && e.password === pass);
  } else {
    try {
      const q = query(collection(db,'employees'), where('id','==',id), where('password','==',pass));
      const snap = await getDocs(q);
      if (!snap.empty) emp = snap.docs[0].data();
    } catch(e) { toast('❌','خطأ في الاتصال'); return; }
  }

  if (!emp) { toast('❌','رقم الموظف أو كلمة المرور غير صحيحة'); return; }

  currentEmp = emp;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';

  const av = document.getElementById('userAv');
  av.textContent = emp.name[0];
  av.style.background = colorFor(emp.name);
  document.getElementById('userName').textContent = emp.name;
  document.getElementById('userDept').textContent = emp.dept || '—';

  await loadWorkSettings();
  await loadTodayStatus();
  locateMe();
}

window.doLogout = function() {
  currentEmp = null; checkedIn = false; checkInTime = null;
  clearInterval(timerInt);
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('loginId').value = '';
  document.getElementById('loginPass').value = '';
}

// ─── GPS ───
window.locateMe = function() {
  document.getElementById('locDot').className = 'pulse-dot y';
  document.getElementById('locTxt').textContent = 'يحدد الموقع...';
  document.getElementById('ringIcon').textContent = '🔄';
  document.getElementById('ringTxt').textContent = 'جارٍ التحديد';
  document.getElementById('btnIn').disabled = true;
  document.getElementById('btnOut').disabled = true;

  if (!navigator.geolocation) { fakeGPS(); return; }
  navigator.geolocation.getCurrentPosition(
    p => { userLat = p.coords.latitude; userLng = p.coords.longitude; onGPSReady(); },
    () => fakeGPS(),
    { enableHighAccuracy:true, timeout:10000, maximumAge:0 }
  );
}

function fakeGPS() {
  if (workLat) {
    const off = (allowedRadius * 0.5) / 111320;
    userLat = workLat + (Math.random()*off - off/2);
    userLng = workLng + (Math.random()*off - off/2);
    toast('🎮','وضع تجريبي — موقع داخل النطاق');
  } else { userLat = 21.4858; userLng = 39.1925; }
  onGPSReady();
}

function onGPSReady() {
  document.getElementById('locDot').className = 'pulse-dot g';
  document.getElementById('locTxt').textContent = 'تم التحديد ✓';
  document.getElementById('coordsTxt').textContent = `${userLat.toFixed(5)}° ، ${userLng.toFixed(5)}°`;
  evalDistance();
}

function dist(la1,lo1,la2,lo2) {
  const R=6371000, dL=(la2-la1)*Math.PI/180, dO=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function evalDistance() {
  const ring = document.getElementById('ringFill');
  const fill = document.getElementById('distFill');

  if (!workLat) {
    document.getElementById('ringIcon').textContent='⚠️';
    document.getElementById('ringTxt').textContent='موقع العمل غير محدد';
    ring.style.stroke='var(--warning)'; ring.style.strokeDashoffset='200';
    document.getElementById('distTxt').textContent='—';
    if (!checkedIn) document.getElementById('btnIn').disabled=false;
    document.getElementById('btnOut').disabled=!checkedIn;
    return;
  }

  const d = dist(userLat,userLng,workLat,workLng);
  const dm = Math.round(d);
  document.getElementById('distTxt').textContent = dm + ' متر';

  const pct = Math.min((d/(allowedRadius*2.5))*100, 100);
  fill.style.width = pct + '%';

  if (d <= allowedRadius) {
    fill.style.background='var(--success)';
    ring.style.stroke='var(--accent)'; ring.style.strokeDashoffset='0';
    document.getElementById('ringIcon').textContent='✅';
    document.getElementById('ringTxt').textContent='داخل النطاق';
    if (!checkedIn) document.getElementById('btnIn').disabled=false;
    document.getElementById('btnOut').disabled=!checkedIn;
    toast('✅',`أنت داخل نطاق العمل — ${dm} م`);
  } else {
    fill.style.background='var(--danger)';
    ring.style.stroke='var(--danger)'; ring.style.strokeDashoffset='160';
    document.getElementById('ringIcon').textContent='❌';
    document.getElementById('ringTxt').textContent=`خارج النطاق (${dm}م)`;
    document.getElementById('btnIn').disabled=true;
    document.getElementById('btnOut').disabled=true;
    toast('❌',`خارج نطاق العمل — ${dm} م`);
  }
}

// ─── ATTENDANCE ───
async function loadTodayStatus() {
  const today = new Date().toDateString();
  let recs = [];

  if (DEMO_MODE) {
    recs = local.getRecords().filter(r => r.empId===currentEmp.id && new Date(r.time).toDateString()===today);
  } else {
    try {
      const start = new Date(); start.setHours(0,0,0,0);
      const q = query(collection(db,'attendance'),
        where('empId','==',currentEmp.id),
        where('time','>=',Timestamp.fromDate(start)),
        orderBy('time','asc'));
      const snap = await getDocs(q);
      recs = snap.docs.map(d => ({...d.data(), time: d.data().time.toDate().toISOString()}));
    } catch(e) {}
  }

  const inRec = recs.find(r=>r.type==='in');
  const outRec = recs.find(r=>r.type==='out');
  if (inRec && !outRec) {
    checkedIn=true; checkInTime=new Date(inRec.time);
    document.getElementById('btnIn').disabled=true;
    document.getElementById('timerCard').classList.add('show');
    startTimer();
  } else if (inRec && outRec) {
    checkedIn=false;
    document.getElementById('warnBox').classList.add('show');
    document.getElementById('btnIn').disabled=true;
    document.getElementById('btnOut').disabled=true;
  }
  renderLog(recs);
}

window.doCheckin = async function() {
  if (!userLat) { toast('⚠️','حدّد موقعك أولاً'); return; }
  // prevent double
  const today = new Date().toDateString();
  const existing = DEMO_MODE
    ? local.getRecords().filter(r=>r.empId===currentEmp.id && new Date(r.time).toDateString()===today)
    : [];
  if (existing.find(r=>r.type==='in')) {
    document.getElementById('warnBox').classList.add('show');
    toast('⚠️','سجّلت حضورك مسبقاً'); return;
  }

  const d = workLat ? Math.round(dist(userLat,userLng,workLat,workLng)) : 0;
  const s = local.getSettings();
  const late = isLate(new Date(), s.shiftStart, s.lateMinutes);

  const rec = { empId:currentEmp.id, empName:currentEmp.name, dept:currentEmp.dept||'—', type:'in', time:new Date().toISOString(), lat:userLat, lng:userLng, distance:d, late };

  if (DEMO_MODE) {
    const recs = local.getRecords(); recs.push(rec); localStorage.setItem('gpsDemo_records', JSON.stringify(recs));
  } else {
    try { await addDoc(collection(db,'attendance'), {...rec, time:serverTimestamp()}); } catch(e) { toast('❌','فشل الحفظ'); return; }
  }

  checkedIn=true; checkInTime=new Date();
  document.getElementById('btnIn').disabled=true;
  document.getElementById('btnOut').disabled=false;
  document.getElementById('timerCard').classList.add('show');
  startTimer();
  await loadTodayStatus();
  toast('✅',`تسجيل حضور ${new Date().toLocaleTimeString('ar-SA')}${late?' — ⚠️ متأخر':''}`);
}

window.doCheckout = async function() {
  const now = new Date();
  const hours = checkInTime ? ((now-checkInTime)/3600000).toFixed(2) : 0;
  const d = workLat ? Math.round(dist(userLat,userLng,workLat,workLng)) : 0;

  const rec = { empId:currentEmp.id, empName:currentEmp.name, dept:currentEmp.dept||'—', type:'out', time:now.toISOString(), lat:userLat, lng:userLng, distance:d, hoursWorked:parseFloat(hours) };

  if (DEMO_MODE) {
    const recs = local.getRecords(); recs.push(rec); localStorage.setItem('gpsDemo_records', JSON.stringify(recs));
  } else {
    try { await addDoc(collection(db,'attendance'), {...rec, time:serverTimestamp()}); } catch(e) { toast('❌','فشل الحفظ'); return; }
  }

  checkedIn=false; clearInterval(timerInt);
  document.getElementById('btnIn').disabled=false;
  document.getElementById('btnOut').disabled=true;
  document.getElementById('timerCard').classList.remove('show');
  document.getElementById('warnBox').classList.add('show');
  await loadTodayStatus();
  toast('🚪',`انصراف ${now.toLocaleTimeString('ar-SA')} — ${hours} ساعة`);
}

function isLate(t, shiftStart, late=15) {
  if (!shiftStart) return false;
  const [h,m] = shiftStart.split(':').map(Number);
  const lim = new Date(t); lim.setHours(h, m+late, 0, 0);
  return t > lim;
}

function renderLog(recs) {
  const el = document.getElementById('logList');
  if (!recs.length) { el.innerHTML='<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px">لا توجد سجلات</div>'; return; }
  el.innerHTML = [...recs].reverse().map(r=>`
    <div class="log-item">
      <span style="color:var(--muted)">${new Date(r.time).toLocaleTimeString('ar-SA')}</span>
      ${r.hoursWorked?`<span style="font-size:11px;color:var(--accent2)">${r.hoursWorked}س</span>`:''}
      <span class="log-badge ${r.type==='in'?'log-in':'log-out'}">${r.type==='in'?'✅ حضور':'🚪 انصراف'}${r.late?' ⚠️':''}</span>
    </div>`).join('');
}

// ─── TIMER / CLOCK ───
function startTimer() {
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    if (!checkInTime) return;
    const s = Math.floor((Date.now()-checkInTime)/1000);
    const h=String(Math.floor(s/3600)).padStart(2,'0');
    const m=String(Math.floor((s%3600)/60)).padStart(2,'0');
    const sec=String(s%60).padStart(2,'0');
    document.getElementById('timerVal').textContent=`${h}:${m}:${sec}`;
  }, 1000);
}

function startClock() {
  function tick() {
    const n=new Date();
    document.getElementById('liveClock').textContent=n.toLocaleTimeString('ar-SA',{hour12:false});
    document.getElementById('dateStr').textContent=n.toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    const h=n.getHours();
    document.getElementById('shiftChip').textContent=h<12?'الوردية الصباحية':h<17?'الوردية المسائية':'الوردية الليلية';
  }
  tick(); clockInt=setInterval(tick,1000);
}

// ─── TOAST ───
let tT;
function toast(icon, msg) {
  document.getElementById('tIcon').textContent=icon;
  document.getElementById('tMsg').textContent=msg;
  const t=document.getElementById('toast');
  t.classList.add('show'); clearTimeout(tT);
  tT=setTimeout(()=>t.classList.remove('show'),3500);
}

init();
</script>
